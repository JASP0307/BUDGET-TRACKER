{% extends "base.html" %}
{% block title %}Nueva contraseña — Budget Tracker{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>Nueva contraseña</h1>
  <p class="lede">Elige una contraseña para tu cuenta.</p>
  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
  <form method="post" action="/reset">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="field">
      <label for="password">Contraseña nueva</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password" minlength="8" required autofocus>
      <small class="muted">Mínimo 8 caracteres.</small>
    </div>
    <button class="block" type="submit">Guardar contraseña</button>
  </form>
</div>
{% endblock %}
