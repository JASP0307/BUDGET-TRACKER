{% extends "base.html" %}
{% block title %}{{ t('Nueva contraseña') }} — Budget Tracker{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>{{ t('Nueva contraseña') }}</h1>
  <p class="lede">{{ t('Elige una contraseña para tu cuenta.') }}</p>
  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
  <form method="post" action="/reset">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="field">
      <label for="password">{{ t('Nueva contraseña') }}</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password" minlength="8" required autofocus>
      <small class="muted">{{ t('Mínimo 8 caracteres.') }}</small>
    </div>
    <button class="block" type="submit">{{ t('Guardar contraseña') }}</button>
  </form>
</div>
{% endblock %}
