{% extends "base.html" %}
{% block title %}Crear cuenta — Budget Tracker{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>Crear cuenta</h1>
  <p class="lede">Registra tu correo para empezar a seguir tus consumos.</p>
  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
  <form method="post" action="/register">
    <div class="field">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="email"
             value="{{ email or '' }}" required autofocus>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password" minlength="8" required>
      <small class="muted">Mínimo 8 caracteres.</small>
    </div>
    <button class="block" type="submit">Crear cuenta</button>
  </form>
  <p class="alt-link">¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a></p>
</div>
{% endblock %}
