{% extends "base.html" %}
{% block title %}Iniciar sesión — Budget Tracker{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>Iniciar sesión</h1>
  <p class="lede">Entra para ver tu presupuesto del mes.</p>
  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <div class="field">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="email"
             value="{{ email or '' }}" required autofocus>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>
    </div>
    <button class="block" type="submit">Entrar</button>
  </form>
  <p class="alt-link">¿Olvidaste tu contraseña? <a href="/forgot">Restablécela</a></p>
  <p class="alt-link">¿No tienes cuenta? <a href="/register">Crear una</a></p>
</div>
{% endblock %}
