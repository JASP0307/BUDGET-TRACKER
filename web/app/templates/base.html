<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2F4F1">
<title>{% block title %}Budget Tracker{% endblock %}</title>
<script>
  (function () {
    var t = localStorage.getItem("theme");
    if (t !== "light" && t !== "dark")
      t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-ui: "Instrument Sans", system-ui, sans-serif;
    --font-mono: "Spline Sans Mono", ui-monospace, SFMono-Regular, monospace;
    --bg: #F2F4F1; --card: #FFFFFF; --ink: #182420; --muted: #5C6B63;
    --line: #DEE5DF; --brand: #0E6B4A;
    --good: #0E6B4A; --warn: #9A6700; --bad: #B3372E;
    --btn-ink: #FFFFFF;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #101613; --card: #18211C; --ink: #E6ECE7; --muted: #8FA096;
    --line: #27332C; --brand: #4CB98A;
    --good: #4CB98A; --warn: #D9A03C; --bad: #E06056;
    --btn-ink: #0E1512;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 var(--font-ui);
  }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .neg { color: var(--bad); } .pos { color: var(--good); }
  .muted { color: var(--muted); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ---- header ---- */
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: .25rem;
    padding: .5rem max(.75rem, env(safe-area-inset-left));
  }
  .brand {
    display: flex; align-items: center; gap: .5rem;
    font-weight: 700; text-decoration: none; padding: .4rem .5rem .4rem 0;
  }
  .brand-mark {
    font-family: var(--font-mono); font-size: .8rem; font-weight: 700;
    color: var(--card); background: var(--brand);
    padding: .15rem .35rem; border-radius: 6px; letter-spacing: .03em;
  }
  nav { display: flex; gap: .25rem; overflow-x: auto; }
  nav a {
    text-decoration: none; color: var(--muted); font-weight: 500;
    padding: .5rem .6rem; border-radius: 8px; white-space: nowrap;
  }
  nav a:hover { color: var(--ink); }
  nav a[aria-current="page"] { color: var(--brand); font-weight: 600; }
  .theme-toggle {
    background: none; border: 1px solid var(--line);
    border-radius: 8px; color: var(--ink); cursor: pointer;
    display: flex; align-items: center; padding: .5rem;
  }
  .theme-toggle:hover { border-color: var(--muted); }
  :root[data-theme="light"] .moon, :root[data-theme="dark"] .sun { display: none; }
  @media (max-width: 430px) { .brand-text { display: none; } nav a { padding: .5rem .45rem; } }

  main {
    max-width: 940px; margin: 0 auto;
    padding: 1rem max(1rem, env(safe-area-inset-left)) 3rem;
  }
  .grid { display: grid; gap: 1rem; align-items: start; }
  @media (min-width: 960px) { .grid.cols { grid-template-columns: 5fr 4fr; } }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 1rem;
  }
  .grid .card { margin-bottom: 0; }
  .section-title {
    margin: 0 0 .75rem; font-size: .8rem; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }

  /* ---- hero ---- */
  .hero { text-align: left; }
  .hero .eyebrow {
    font-family: var(--font-mono); font-size: .8rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--brand); margin: 0 0 .25rem;
  }
  .hero .amount {
    font-family: var(--font-mono); font-weight: 700; line-height: 1.1;
    font-size: clamp(2.1rem, 9vw, 3.4rem); margin: 0;
    font-variant-numeric: tabular-nums;
  }
  .hero .amount small { font-size: .45em; font-weight: 500; color: var(--muted); }
  .hero .sub { margin: .4rem 0 0; color: var(--muted); font-size: .95rem; }

  /* ---- category rows (fill = % spent) ---- */
  .cats { list-style: none; margin: 0; padding: 0; }
  .cat {
    --c: var(--good);
    position: relative; overflow: hidden; border-radius: 10px;
    padding: .55rem .7rem; margin-bottom: .35rem;
  }
  .cat.warn { --c: var(--warn); } .cat.bad { --c: var(--bad); }
  .cat .fill {
    position: absolute; inset: 0 auto 0 0; display: block;
    background: color-mix(in srgb, var(--c) 14%, transparent);
    border-right: 2px solid var(--c);
  }
  .cat > div { position: relative; }
  .cat-line { display: flex; justify-content: space-between; gap: .75rem; align-items: baseline; }
  .cat-name { font-weight: 600; }
  .cat-left { font-weight: 500; }
  .cat-meta {
    display: flex; justify-content: space-between; gap: .75rem;
    font-size: .82rem; color: var(--muted); margin-top: .1rem;
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  }

  /* ---- transaction list ---- */
  .txns { list-style: none; margin: 0; padding: 0; }
  .txn { padding: .6rem 0; border-bottom: 1px solid var(--line); }
  .txn:last-child { border-bottom: 0; }
  .txn-line { display: flex; justify-content: space-between; gap: .75rem; align-items: baseline; }
  .txn-merchant { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .txn-meta {
    display: flex; justify-content: space-between; align-items: center;
    gap: .75rem; margin-top: .2rem; font-size: .85rem; color: var(--muted);
  }

  /* ---- forms ---- */
  input, select, button {
    font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: .5rem .6rem;
  }
  select { max-width: 11rem; }
  button {
    background: var(--brand); border-color: var(--brand); cursor: pointer;
    font-weight: 600; color: var(--btn-ink);
  }
  button.quiet {
    background: none; border-color: var(--line); color: var(--muted);
    font-weight: 500; padding: .25rem .55rem; font-size: .85rem;
  }
  button.quiet:hover { color: var(--bad); border-color: var(--bad); }
  form.inline { display: inline; }
  input.amount {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    text-align: right; width: 8.5rem;
  }

  /* ---- misc ---- */
  .cta {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap;
    border-color: color-mix(in srgb, var(--brand) 40%, var(--line));
    background: color-mix(in srgb, var(--brand) 6%, var(--card));
  }
  .cta-btn {
    flex: none; text-decoration: none; background: var(--brand);
    color: var(--btn-ink); font-weight: 600; padding: .55rem .9rem;
    border-radius: 8px;
  }
  a.pill { text-decoration: none; }
  .pills { display: flex; flex-wrap: wrap; gap: .5rem; }
  .pill {
    border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
    background: color-mix(in srgb, var(--warn) 10%, transparent);
    color: var(--ink); border-radius: 999px; padding: .25rem .7rem; font-size: .85rem;
  }
  code {
    font-family: var(--font-mono); font-size: .85em;
    background: color-mix(in srgb, var(--line) 55%, transparent);
    padding: .1rem .35rem; border-radius: 6px; overflow-wrap: anywhere;
  }
  .field-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .field-row input[name="substring"] { flex: 1 1 12rem; min-width: 0; }

  /* ---- auth ---- */
  .auth-wrap { max-width: 23rem; margin: 2.5rem auto 0; }
  .auth-wrap h1 {
    font-size: 1.4rem; margin: 0 0 .3rem;
  }
  .auth-wrap .lede { margin: 0 0 1.25rem; color: var(--muted); font-size: .95rem; }
  .field { display: block; margin-bottom: .9rem; }
  .field label {
    display: block; font-size: .82rem; font-weight: 600;
    color: var(--muted); margin-bottom: .3rem;
  }
  .field input { width: 100%; }
  button.block { width: 100%; padding: .65rem; margin-top: .25rem; }
  .alt-link { margin-top: 1.1rem; font-size: .9rem; color: var(--muted); }
  .alert {
    border-radius: 10px; padding: .6rem .8rem; margin-bottom: 1rem;
    font-size: .9rem; border: 1px solid;
  }
  .alert.err {
    color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent);
    background: color-mix(in srgb, var(--bad) 8%, transparent);
  }
  .user-menu {
    margin-left: auto; display: flex; align-items: center; gap: .6rem;
  }
  .user-menu .who {
    font-size: .85rem; color: var(--muted); max-width: 12rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  @media (max-width: 560px) { .user-menu .who { display: none; } }

  /* ---- setup wizard ---- */
  .setup { max-width: 640px; margin: 0 auto; }
  .setup > h1 { font-size: 1.5rem; margin: .25rem 0 .3rem; }
  .setup > .lede { margin: 0 0 1.5rem; color: var(--muted); }
  .step-head { display: flex; align-items: center; gap: .6rem; margin-bottom: .9rem; }
  .step-head h2 { font-size: 1.05rem; margin: 0; }
  .step-n {
    flex: none; width: 1.6rem; height: 1.6rem; border-radius: 50%;
    display: grid; place-items: center; font-family: var(--font-mono);
    font-size: .85rem; font-weight: 700;
    color: var(--muted); background: color-mix(in srgb, var(--line) 55%, transparent);
    border: 1px solid var(--line);
  }
  .step-n.done {
    color: var(--btn-ink); background: var(--brand); border-color: var(--brand);
  }
  .step-n.done::after { content: "✓"; }
  .step-n.done { font-size: 0; }
  .step-n.done::after { font-size: .95rem; }

  .card-list { list-style: none; margin: 0 0 1rem; padding: 0; }
  .card-row {
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
    padding: .55rem 0; border-bottom: 1px solid var(--line);
  }
  .card-label-form {
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
    flex: 1 1 auto; min-width: 0;
  }
  .card-id { font-weight: 600; white-space: nowrap; }
  .card-label-form input { flex: 1 1 8rem; min-width: 0; }
  .add-card { padding-top: .25rem; }
  .add-card input[name="last4"] { width: 6rem; flex: none; }
  .add-card input[name="label"] { flex: 1 1 8rem; min-width: 0; }
  .small-btn {
    background: none; border: 1px solid var(--line); color: var(--ink);
    font-weight: 500; padding: .35rem .6rem; font-size: .85rem;
  }
  .small-btn:hover { border-color: var(--brand); color: var(--brand); }

  .copybar {
    display: flex; align-items: center; gap: .5rem; margin: .5rem 0;
    border: 1px solid var(--line); border-radius: 10px; padding: .35rem .35rem .35rem .7rem;
    background: color-mix(in srgb, var(--line) 25%, transparent);
  }
  .copybar code {
    flex: 1 1 auto; background: none; padding: 0; font-size: .9rem;
    overflow-x: auto; white-space: nowrap;
  }
  .copybar .small-btn { flex: none; background: var(--card); }

  ol.steps { margin: 1rem 0 0; padding-left: 1.2rem; }
  ol.steps li { margin-bottom: .7rem; }

  .code-box {
    margin-top: 1rem; padding: .9rem 1rem; border-radius: 10px;
    border: 1px dashed var(--line); display: flex; flex-direction: column; gap: .2rem;
  }
  .code-box.shown { border-style: solid; border-color: var(--brand); }
  .code-box #code-value:empty { display: none; }
  .code-box #code-value {
    font-size: 1.8rem; font-weight: 700; letter-spacing: .12em;
    color: var(--brand);
  }

  .status-line { display: flex; align-items: center; gap: .5rem; margin: 0; }
  .status-line.hidden, .hidden { display: none; }
  .status-line.ok { color: var(--good); }
  .status-line .check {
    display: grid; place-items: center; width: 1.3rem; height: 1.3rem;
    border-radius: 50%; background: var(--good); color: var(--btn-ink);
    font-size: .8rem; font-weight: 700;
  }
  .status-line .dot {
    width: .6rem; height: .6rem; border-radius: 50%; flex: none;
    background: var(--warn);
  }
  @media (prefers-reduced-motion: no-preference) {
    .status-line .dot { animation: pulse 1.6s ease-in-out infinite; }
  }
  @keyframes pulse { 50% { opacity: .3; } }

  @media (prefers-reduced-motion: no-preference) {
    .cat .fill { transition: width .4s ease; }
    nav a, button, .theme-toggle { transition: color .15s ease, border-color .15s ease; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><span class="brand-mark">RD$</span><span class="brand-text">Budget</span></a>
  {% if request.state.user %}
  <nav>
    <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Inicio</a>
    <a href="/budgets" {% if request.url.path == "/budgets" %}aria-current="page"{% endif %}>Presupuesto</a>
    <a href="/rules" {% if request.url.path == "/rules" %}aria-current="page"{% endif %}>Reglas</a>
    <a href="/setup" {% if request.url.path == "/setup" %}aria-current="page"{% endif %}>Conectar</a>
  </nav>
  {% endif %}
  <div class="user-menu">
    {% if request.state.user %}
    <span class="who">{{ request.state.user.email }}</span>
    <form class="inline" method="post" action="/logout">
      <button class="quiet" type="submit">Salir</button>
    </form>
    {% endif %}
    <button class="theme-toggle" type="button" onclick="toggleTheme()"
            aria-label="Cambiar entre tema claro y oscuro">
      <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M19.1 4.9l-2.2 2.2M7.1 16.9l-2.2 2.2"/>
      </svg>
      <svg class="moon" width="18" height="18" viewBox="0 0 24 24"
           fill="currentColor" aria-hidden="true">
        <path d="M20.6 14.6A8.5 8.5 0 0 1 9.4 3.4a8.5 8.5 0 1 0 11.2 11.2z"/>
      </svg>
    </button>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<script>
  function toggleTheme() {
    var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("theme", next);
    syncThemeColor();
  }
  function syncThemeColor() {
    document.querySelector('meta[name="theme-color"]').content =
      document.documentElement.dataset.theme === "dark" ? "#101613" : "#F2F4F1";
  }
  syncThemeColor();
</script>
</body>
</html>
