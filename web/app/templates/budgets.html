{% extends "base.html" %}
{% block title %}{{ t('Presupuesto') }} — Cualto{% endblock %}
{% block content %}
<section class="card">
  <h2 class="section-title">{{ t('Presupuesto') }} · {{ meses[month.month - 1] }} {{ month.year }}</h2>
  <p class="muted" style="margin-top:0">{{ t('Monto mensual por categoría, en RD$.') }}</p>
  <form method="post" action="/budgets">
    <ul class="cats">
      {% for r in rows %}
      <li class="cat" style="padding:.4rem .7rem">
        <div class="cat-line">
          <label class="cat-name" for="budget_{{ r.category.id }}">{{ r.category.name }}</label>
          <input class="amount" type="number" inputmode="numeric" step="1" min="0"
                 id="budget_{{ r.category.id }}" name="budget_{{ r.category.id }}"
                 value="{{ "%.0f" | format(r.budget) }}">
        </div>
      </li>
      {% endfor %}
    </ul>
    <p><button type="submit">{{ t('Guardar cambios') }}</button></p>
  </form>
</section>
{% endblock %}
