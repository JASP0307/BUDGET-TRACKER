# Production stack for the VPS: Postgres + app + Caddy (auto-HTTPS).
# Secrets live in .env (see .env.example) — never in this file.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: budget
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BUDGET_DATABASE_URL: postgresql+psycopg://budget:${POSTGRES_PASSWORD}@db:5432/budget
      BUDGET_WEBHOOK_SECRET: ${BUDGET_WEBHOOK_SECRET:?set in .env}
      BUDGET_FERNET_KEY: ${BUDGET_FERNET_KEY:-}
      BUDGET_INBOUND_DOMAIN: ${BUDGET_INBOUND_DOMAIN:-in.example.do}
      BUDGET_USER_EMAIL: ${BUDGET_USER_EMAIL:-jabner0703@gmail.com}
      BUDGET_TELEGRAM_TOKEN: ${BUDGET_TELEGRAM_TOKEN:-}
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
