# Production stack for the VPS: Postgres + app + Caddy (auto-HTTPS).
# Secrets live in .env (see .env.example) — never in this file.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: budget
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # production turns on the startup secret check, Secure cookies and the
      # required-Fernet-key rule (see web/app/settings.py).
      BUDGET_ENV: ${BUDGET_ENV:-production}
      BUDGET_DATABASE_URL: postgresql+psycopg://budget:${POSTGRES_PASSWORD}@db:5432/budget
      BUDGET_WEBHOOK_SECRET: ${BUDGET_WEBHOOK_SECRET:?set in .env}
      BUDGET_FERNET_KEY: ${BUDGET_FERNET_KEY:?set in .env}
      BUDGET_INBOUND_DOMAIN: ${BUDGET_INBOUND_DOMAIN:-in.example.do}
      BUDGET_USER_EMAIL: ${BUDGET_USER_EMAIL:-jabner0703@gmail.com}
      BUDGET_TELEGRAM_TOKEN: ${BUDGET_TELEGRAM_TOKEN:-}
      BUDGET_TELEGRAM_BOT_USERNAME: ${BUDGET_TELEGRAM_BOT_USERNAME:-}
      BUDGET_TELEGRAM_WEBHOOK_SECRET: ${BUDGET_TELEGRAM_WEBHOOK_SECRET:?set in .env}
      BUDGET_SESSION_SECRET: ${BUDGET_SESSION_SECRET:?set in .env}
      BUDGET_BASE_URL: ${BUDGET_BASE_URL:?set in .env — must be https://}
      # Outbound mail (Resend). Without these, signup confirmations are never
      # sent, so production refuses to boot — fail here, with a clearer message.
      BUDGET_RESEND_TOKEN: ${BUDGET_RESEND_TOKEN:?set in .env — Resend API key}
      BUDGET_FROM_EMAIL: ${BUDGET_FROM_EMAIL:?set in .env — address on a verified sending domain}
      # Inbound only (Postmark receives forwarded bank mail; it does not send).
      BUDGET_POSTMARK_TOKEN: ${BUDGET_POSTMARK_TOKEN:-}
      BUDGET_BOOTSTRAP_PASSWORD: ${BUDGET_BOOTSTRAP_PASSWORD:-}
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
