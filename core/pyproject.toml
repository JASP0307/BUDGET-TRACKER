[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetcore"
version = "0.2.0"
description = "Pure domain logic for the budget tracker: parsers, categorization, dedupe, messages"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12"]

[tool.setuptools.packages.find]
include = ["budgetcore*"]
